target-version = "py312"
line-length = 88

# 1. Global Exclusions
extend-exclude = [
    "migrations",    # Alembic migrations
    ".venv",         # Virtual environment
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "N", "PLC", "PLE", "S", "PTH", "RUF",
    "ASYNC", # async/await validation
    "TCH",   # circular import management
    "DTZ",   # timezone-aware datetimes
]

ignore = [
    # --- Formatter Conflicts & Noise ---
    "E501",   # Ignore line-length violations (let the formatter handle it)
    "W191", "E111", "E114", "E117", "D206", "D300", "COM812", "ISC001", 
    
    # --- FastAPI & SQLAlchemy Specifics ---
    "B008",   # Allow Depends() in function arguments
    "S104",   # Allow 0.0.0.0 binding (common in Docker)
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/**" = ["S101", "S105", "S106"]
# Allow nested imports for circular dependencies in your split models
"**/models/**/*.py" = ["PLC0415", "TCH001", "TCH002"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[lint.isort]
combine-as-imports = true
known-first-party = ["app"] 

[lint.flake8-type-checking]
# Keeps models working at runtime
runtime-evaluated-base-classes = [
    "pydantic.BaseModel", 
    "sqlalchemy.orm.DeclarativeBase",
    "sqlalchemy.orm.MappedAsDataclass",
]