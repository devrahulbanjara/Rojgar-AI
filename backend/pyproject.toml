[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.57",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-aws>=1.3.0",
    "langchain-google-genai>=4.2.1",
    "langchain-groq>=1.1.2",
    "langchain-qdrant>=1.1.0",
    "langchain-tavily>=0.2.17",
    "langgraph-checkpoint-postgres>=3.0.0",
    "qdrant-client>=1.13.0",
    "fastembed>=0.4.2",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.2.1",
    "redis>=7.2.1",
    "sqlalchemy[asyncio]>=2.0.47",
    "langgraph>=1.0.9",
    "groq>=0.37.1",
    "psycopg[binary]>=3.3.3",
    "llama-cloud-services",
    "llama-cloud>=0.1.46",
    "apscheduler>=3.11.2",
    "google-genai>=1.67.0",
    "weasyprint>=68.1",
    "jinja2>=3.1.6",
    "rapidfuzz>=3.14.3",
    "rich>=14.3.3",
    "fastapi-limiter>=0.2.0",
    "fastapi[standard]>=0.136.1",
    "numpy>=2.4.4",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.8.0",
    "nemoguardrails>=0.21.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--tb=long -v --html=tests/report.html --self-contained-html"
filterwarnings = [
    "ignore::DeprecationWarning:google.genai",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:nemoguardrails",
    "ignore::DeprecationWarning:langchain_community",
    "ignore::DeprecationWarning:langgraph",
    "ignore::PendingDeprecationWarning:langgraph",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
markers = [
    "hybrid_eval: opt-in ranking-quality eval against real Qdrant + Gemini (set RUN_HYBRID_EVAL=1 to run)",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-html>=4.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
extend-exclude = ["*.ipynb"]
