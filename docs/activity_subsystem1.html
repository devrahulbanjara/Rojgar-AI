<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ConvexHire — Subsystem 1 Activity Diagram</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 24px;
      color: #1c2432;
    }
    .wrap {
      background: #ffffff;
      border: 1px solid #c8d0da;
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    text {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #1c2432;
    }
    .lane-title { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .action     { font-size: 13px; text-anchor: middle; }
    .guard      { font-size: 12px; font-style: italic; fill: #444; }
    .deco       { font-size: 12px; text-anchor: middle; fill: #1c2432; }

    .lane       { fill: #ffffff; stroke: #1c2432; stroke-width: 1.2; }
    .lane-head  { fill: #f1f3f7; stroke: #1c2432; stroke-width: 1.2; }
    .action-box { fill: #ffffff; stroke: #1c2432; stroke-width: 1.4; }
    .diamond    { fill: #ffffff; stroke: #1c2432; stroke-width: 1.4; }
    .bar        { fill: #1c2432; }
    .flow       { stroke: #1c2432; stroke-width: 1.4; fill: none; }
    .start-end  { fill: #1c2432; }
    .final-ring { fill: #ffffff; stroke: #1c2432; stroke-width: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 1400 1520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#1c2432"/>
        </marker>
      </defs>

      <!-- =========================
           Swimlanes
           ========================= -->
      <!-- Lane bodies -->
      <rect class="lane" x="20"   y="60" width="460" height="1440"/>
      <rect class="lane" x="480"  y="60" width="460" height="1440"/>
      <rect class="lane" x="940"  y="60" width="460" height="1440"/>
      <!-- Lane headers -->
      <rect class="lane-head" x="20"   y="20" width="460" height="40"/>
      <rect class="lane-head" x="480"  y="20" width="460" height="40"/>
      <rect class="lane-head" x="940"  y="20" width="460" height="40"/>
      <text class="lane-title" x="250"  y="46">User (Candidate / Recruiter / Admin)</text>
      <text class="lane-title" x="710"  y="46">Backend</text>
      <text class="lane-title" x="1170" y="46">Email Service</text>

      <!-- =========================
           Nodes
           ========================= -->
      <!-- 1. Initial node -->
      <circle class="start-end" cx="250" cy="90" r="11"/>

      <!-- 2. Action: Open Sign Up page (Candidate) -->
      <rect class="action-box" x="145" y="130" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="158">Open Sign Up page</text>

      <!-- 3. Merge diamond (loop target) -->
      <polygon class="diamond" points="250,210 310,250 250,290 190,250"/>
      <text class="deco" x="250" y="254">merge</text>

      <!-- 4. Action: Fill email + password -->
      <rect class="action-box" x="145" y="320" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="348">Fill email + password</text>

      <!-- 5. Action: Submit form -->
      <rect class="action-box" x="145" y="400" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="428">Submit form</text>

      <!-- 6. Action: Validate fields (Backend) -->
      <rect class="action-box" x="605" y="480" width="210" height="46" rx="22"/>
      <text class="action" x="710" y="508">Validate fields</text>

      <!-- 7. Decision: Fields valid? -->
      <polygon class="diamond" points="710,560 790,610 710,660 630,610"/>
      <text class="deco" x="710" y="608">valid?</text>
      <text class="deco" x="710" y="624" font-size="11">fields</text>

      <!-- 8. Action: Show error (Candidate) -->
      <rect class="action-box" x="145" y="720" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="748">Show error message</text>

      <!-- 9. Action: Hash password + create user (Backend) -->
      <rect class="action-box" x="605" y="720" width="210" height="46" rx="22"/>
      <text class="action" x="710" y="748">Hash password + create user</text>

      <!-- 10. Action: Generate verification token (Backend) -->
      <rect class="action-box" x="605" y="800" width="210" height="46" rx="22"/>
      <text class="action" x="710" y="828">Generate verification token</text>

      <!-- 11. Action: Send verification email (Email Service) -->
      <rect class="action-box" x="1065" y="880" width="210" height="46" rx="22"/>
      <text class="action" x="1170" y="908">Send verification email</text>

      <!-- 12. Action: Click verification link (Candidate) -->
      <rect class="action-box" x="145" y="970" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="998">Click verification link</text>

      <!-- 13. Action: Verify token (Backend) -->
      <rect class="action-box" x="605" y="1060" width="210" height="46" rx="22"/>
      <text class="action" x="710" y="1088">Verify token</text>

      <!-- 14. Decision: Token valid? -->
      <polygon class="diamond" points="710,1140 790,1190 710,1240 630,1190"/>
      <text class="deco" x="710" y="1188">valid?</text>
      <text class="deco" x="710" y="1204" font-size="11">token</text>

      <!-- 15. Action: Show expired error (Candidate) -->
      <rect class="action-box" x="145" y="1170" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="1198">Show expired error</text>

      <!-- 16. Flow final node (alternate end, X circle) -->
      <circle class="final-ring" cx="250" cy="1270" r="14"/>
      <line class="flow" x1="240" y1="1260" x2="260" y2="1280"/>
      <line class="flow" x1="260" y1="1260" x2="240" y2="1280"/>

      <!-- 17. Action: Mark verified + issue JWT (Backend) -->
      <rect class="action-box" x="605" y="1290" width="210" height="46" rx="22"/>
      <text class="action" x="710" y="1318">Mark verified + issue JWT</text>

      <!-- 18. Action: Redirect to dashboard (Candidate) -->
      <rect class="action-box" x="145" y="1380" width="210" height="46" rx="22"/>
      <text class="action" x="250" y="1408">Redirect to role dashboard</text>

      <!-- 19. Activity Final (bullseye) -->
      <circle class="final-ring" cx="250" cy="1465" r="14"/>
      <circle class="start-end"  cx="250" cy="1465" r="8"/>

      <!-- =========================
           Control flow arrows
           ========================= -->
      <!-- Start → Open Sign Up page -->
      <line class="flow" x1="250" y1="101" x2="250" y2="128" marker-end="url(#arrow)"/>
      <!-- Open Sign Up → Merge -->
      <line class="flow" x1="250" y1="176" x2="250" y2="208" marker-end="url(#arrow)"/>
      <!-- Merge → Fill form -->
      <line class="flow" x1="250" y1="290" x2="250" y2="318" marker-end="url(#arrow)"/>
      <!-- Fill form → Submit -->
      <line class="flow" x1="250" y1="366" x2="250" y2="398" marker-end="url(#arrow)"/>
      <!-- Submit → Validate (cross to Backend) -->
      <path class="flow" d="M 355 423 L 605 503" marker-end="url(#arrow)"/>
      <!-- Validate → Decision valid? -->
      <line class="flow" x1="710" y1="526" x2="710" y2="558" marker-end="url(#arrow)"/>

      <!-- Decision invalid → Show error (cross to Candidate) -->
      <path class="flow" d="M 630 610 L 355 743" marker-end="url(#arrow)"/>
      <text class="guard" x="430" y="666">[invalid]</text>
      <!-- Show error → Merge (loop back up) -->
      <path class="flow" d="M 145 743 L 90 743 L 90 250 L 190 250" marker-end="url(#arrow)"/>

      <!-- Decision valid → Hash + create user -->
      <line class="flow" x1="710" y1="660" x2="710" y2="718" marker-end="url(#arrow)"/>
      <text class="guard" x="725" y="690">[valid]</text>

      <!-- Hash + create → Generate token -->
      <line class="flow" x1="710" y1="766" x2="710" y2="798" marker-end="url(#arrow)"/>
      <!-- Generate token → Send email (cross to Email Service) -->
      <path class="flow" d="M 815 823 L 1065 903" marker-end="url(#arrow)"/>
      <!-- Send email → Click verification link (cross back to Candidate) -->
      <path class="flow" d="M 1065 903 L 355 993" marker-end="url(#arrow)"/>
      <!-- Click link → Verify token (cross to Backend) -->
      <path class="flow" d="M 355 993 L 605 1083" marker-end="url(#arrow)"/>
      <!-- Verify token → Decision token valid? -->
      <line class="flow" x1="710" y1="1106" x2="710" y2="1138" marker-end="url(#arrow)"/>

      <!-- Decision expired → Show expired error (cross to Candidate) -->
      <path class="flow" d="M 630 1190 L 355 1193" marker-end="url(#arrow)"/>
      <text class="guard" x="430" y="1180">[expired]</text>
      <!-- Show expired → Flow Final -->
      <line class="flow" x1="250" y1="1216" x2="250" y2="1256" marker-end="url(#arrow)"/>

      <!-- Decision valid → Mark verified + issue JWT -->
      <line class="flow" x1="710" y1="1240" x2="710" y2="1288" marker-end="url(#arrow)"/>
      <text class="guard" x="725" y="1270">[valid]</text>

      <!-- Mark verified → Redirect to dashboard (cross to Candidate) -->
      <path class="flow" d="M 605 1313 L 355 1403" marker-end="url(#arrow)"/>
      <!-- Redirect → Activity Final -->
      <line class="flow" x1="250" y1="1426" x2="250" y2="1451" marker-end="url(#arrow)"/>
    </svg>
  </div>
</body>
</html>
