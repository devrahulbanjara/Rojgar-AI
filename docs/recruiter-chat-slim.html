<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body{margin:0;padding:0;background:#fff;font-family:Inter,system-ui,sans-serif}
  svg{display:block}
</style></head><body>
<svg width="1100" height="370" viewBox="0 0 1100 370" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2240"/>
    </marker>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>

    <symbol id="search" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6" fill="none" stroke="#0e4f5b" stroke-width="2"/>
      <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="#0e4f5b" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="briefcase" viewBox="0 0 24 24">
      <rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="#1e3a8a" stroke-width="2"/>
      <path d="M9 7 V5 a1 1 0 0 1 1 -1 h4 a1 1 0 0 1 1 1 V7" fill="none" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="3" y1="13" x2="21" y2="13" stroke="#1e3a8a" stroke-width="2"/>
    </symbol>
    <symbol id="pencil" viewBox="0 0 24 24">
      <path d="M3 21 L7 20 L20 7 L17 4 L4 17 Z" fill="none" stroke="#14532d" stroke-width="2" stroke-linejoin="round"/>
      <line x1="14" y1="7" x2="17" y2="10" stroke="#14532d" stroke-width="2"/>
    </symbol>
    <symbol id="globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#3b1d6f" stroke-width="2"/>
      <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="#3b1d6f" stroke-width="2"/>
      <line x1="3" y1="12" x2="21" y2="12" stroke="#3b1d6f" stroke-width="2"/>
    </symbol>
    <symbol id="chat" viewBox="0 0 24 24">
      <path d="M4 5 h16 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 H10 l-5 4 V17 H4 a2 2 0 0 1 -2 -2 V7 a2 2 0 0 1 2 -2 Z" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="user" viewBox="0 0 40 40">
      <circle cx="20" cy="14" r="7" fill="#fff" stroke="#1e1b4b" stroke-width="1.8"/>
      <path d="M6 36 C 6 26, 34 26, 34 36" fill="#fff" stroke="#1e1b4b" stroke-width="1.8"/>
    </symbol>
    <symbol id="memory" viewBox="0 0 24 24">
      <rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="#831843" stroke-width="2"/>
      <line x1="7" y1="6" x2="7" y2="3" stroke="#831843" stroke-width="2"/>
      <line x1="12" y1="6" x2="12" y2="3" stroke="#831843" stroke-width="2"/>
      <line x1="17" y1="6" x2="17" y2="3" stroke="#831843" stroke-width="2"/>
      <line x1="7" y1="21" x2="7" y2="18" stroke="#831843" stroke-width="2"/>
      <line x1="12" y1="21" x2="12" y2="18" stroke="#831843" stroke-width="2"/>
      <line x1="17" y1="21" x2="17" y2="18" stroke="#831843" stroke-width="2"/>
    </symbol>
  </defs>

  <text x="550" y="36" text-anchor="middle" fill="#1a2240" font-size="22" font-weight="800">Recruiter Chat Capabilities</text>

  <!-- Recruiter node -->
  <g transform="translate(440,70)">
    <rect width="220" height="80" rx="14" fill="url(#gIndigo)" stroke="#6366f1" stroke-width="2"/>
    <use href="#user" x="14" y="20" width="40" height="40"/>
    <text x="135" y="36" text-anchor="middle" fill="#1e1b4b" font-size="14" font-weight="800">Recruiter Chat</text>
    <text x="135" y="56" text-anchor="middle" fill="#4338ca" font-size="11">intent router</text>
    <text x="135" y="72" text-anchor="middle" fill="#4338ca" font-size="11">rules + LLM fallback</text>
  </g>

  <!-- Fan-out bus -->
  <path d="M550 150 V180" stroke="#1a2240" stroke-width="2" fill="none"/>
  <path d="M120 180 L980 180" stroke="#1a2240" stroke-width="2" fill="none"/>
  <path d="M175 180 V215" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M345 180 V215" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M520 180 V215" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M695 180 V215" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M870 180 V215" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Candidate Search -->
  <g transform="translate(90,220)">
    <rect width="170" height="120" rx="14" fill="url(#gCyan)" stroke="#06b6d4" stroke-width="1.8"/>
    <use href="#search" x="68" y="14" width="34" height="34"/>
    <text x="85" y="68" text-anchor="middle" fill="#0e4f5b" font-size="13" font-weight="800">Candidate Search</text>
    <text x="85" y="88" text-anchor="middle" fill="#0e4f5b" font-size="11">hybrid retrieval</text>
    <text x="85" y="104" text-anchor="middle" fill="#0e4f5b" font-size="11">skills, exp, location</text>
  </g>

  <!-- Job Lookup -->
  <g transform="translate(260,220)">
    <rect width="170" height="120" rx="14" fill="url(#gIndigo)" stroke="#1e3a8a" stroke-width="1.8"/>
    <use href="#briefcase" x="68" y="14" width="34" height="34"/>
    <text x="85" y="68" text-anchor="middle" fill="#1e1b4b" font-size="13" font-weight="800">Job Lookup</text>
    <text x="85" y="88" text-anchor="middle" fill="#1e1b4b" font-size="11">company scoped</text>
    <text x="85" y="104" text-anchor="middle" fill="#1e1b4b" font-size="11">status, applicants</text>
  </g>

  <!-- Job Edit -->
  <g transform="translate(435,220)">
    <rect width="170" height="120" rx="14" fill="url(#gGreen)" stroke="#16a34a" stroke-width="1.8"/>
    <use href="#pencil" x="68" y="14" width="34" height="34"/>
    <text x="85" y="68" text-anchor="middle" fill="#14532d" font-size="13" font-weight="800">Job Edit</text>
    <text x="85" y="88" text-anchor="middle" fill="#14532d" font-size="11">preview diff</text>
    <text x="85" y="104" text-anchor="middle" fill="#14532d" font-size="11">human confirm</text>
  </g>

  <!-- Salary Research -->
  <g transform="translate(610,220)">
    <rect width="170" height="120" rx="14" fill="url(#gPurple)" stroke="#7c3aed" stroke-width="1.8"/>
    <use href="#globe" x="68" y="14" width="34" height="34"/>
    <text x="85" y="68" text-anchor="middle" fill="#3b1d6f" font-size="13" font-weight="800">Salary Research</text>
    <text x="85" y="88" text-anchor="middle" fill="#3b1d6f" font-size="11">web search tool</text>
    <text x="85" y="104" text-anchor="middle" fill="#3b1d6f" font-size="11">cited sources</text>
  </g>

  <!-- General Chat -->
  <g transform="translate(785,220)">
    <rect width="170" height="120" rx="14" fill="url(#gAmber)" stroke="#f59e0b" stroke-width="1.8"/>
    <use href="#chat" x="68" y="14" width="34" height="34"/>
    <text x="85" y="68" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="800">General Chat</text>
    <text x="85" y="88" text-anchor="middle" fill="#7c2d12" font-size="11">platform Q and A</text>
    <text x="85" y="104" text-anchor="middle" fill="#7c2d12" font-size="11">no tool call</text>
  </g>

</svg>
</body></html>
