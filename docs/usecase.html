<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rojgar AI — Use Case Diagram</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 24px;
      color: #1c2432;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    p.sub {
      margin: 0 0 16px;
      color: #6e7383;
      font-size: 14px;
    }
    .wrap {
      background: #ffffff;
      border: 1px solid #c8d0da;
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    text {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #1c2432;
    }
    .actor-label { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .uc-label    { font-size: 13px; text-anchor: middle; }
    .system-label{ font-size: 14px; font-weight: 600; fill: #5a6172; }
    .rel-label   { font-size: 11px; font-style: italic; fill: #555; text-anchor: middle; }

    .actor    { stroke: #1c2432; stroke-width: 2; fill: none; }
    .system   { fill: #fff8e1; stroke: #1c2432; stroke-width: 1.5; }
    .uc       { fill: #ffffff; stroke: #1c2432; stroke-width: 1.5; }
    .uc-ai    { fill: #eef5ff; stroke: #1c2432; stroke-width: 1.5; }
    .link     { stroke: #1c2432; stroke-width: 1.2; fill: none; }
    .rel      { stroke: #1c2432; stroke-width: 1; fill: none; stroke-dasharray: 5 4; }
    .gen      { stroke: #1c2432; stroke-width: 1.4; fill: none; }
    .arrow    { fill: #1c2432; }
    .gen-head { stroke: #1c2432; stroke-width: 1.4; fill: #ffffff; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 1500 1200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
        </marker>
      </defs>

      <!-- System boundary -->
      <rect class="system" x="380" y="80" width="780" height="1080" rx="6" />
      <text class="system-label" x="1150" y="104" text-anchor="end">Rojgar AI System</text>

      <!-- ===================== ACTORS (left) ===================== -->
      <!-- Candidate -->
      <g transform="translate(120,160)">
        <circle class="actor" cx="0" cy="0" r="18"/>
        <line class="actor" x1="0" y1="18" x2="0" y2="70"/>
        <line class="actor" x1="-28" y1="36" x2="28" y2="36"/>
        <line class="actor" x1="0" y1="70" x2="-22" y2="108"/>
        <line class="actor" x1="0" y1="70" x2="22" y2="108"/>
        <text class="actor-label" x="0" y="134">Candidate</text>
      </g>

      <!-- Recruiter -->
      <g transform="translate(120,560)">
        <circle class="actor" cx="0" cy="0" r="18"/>
        <line class="actor" x1="0" y1="18" x2="0" y2="70"/>
        <line class="actor" x1="-28" y1="36" x2="28" y2="36"/>
        <line class="actor" x1="0" y1="70" x2="-22" y2="108"/>
        <line class="actor" x1="0" y1="70" x2="22" y2="108"/>
        <text class="actor-label" x="0" y="134">Recruiter</text>
      </g>

      <!-- Company Admin -->
      <g transform="translate(120,990)">
        <circle class="actor" cx="0" cy="0" r="18"/>
        <line class="actor" x1="0" y1="18" x2="0" y2="70"/>
        <line class="actor" x1="-28" y1="36" x2="28" y2="36"/>
        <line class="actor" x1="0" y1="70" x2="-22" y2="108"/>
        <line class="actor" x1="0" y1="70" x2="22" y2="108"/>
        <text class="actor-label" x="0" y="134">Company Admin</text>
      </g>

      <!-- ===================== ACTORS (right) ===================== -->
      <!-- AI Service -->
      <g transform="translate(1380,400)">
        <circle class="actor" cx="0" cy="0" r="18"/>
        <line class="actor" x1="0" y1="18" x2="0" y2="70"/>
        <line class="actor" x1="-28" y1="36" x2="28" y2="36"/>
        <line class="actor" x1="0" y1="70" x2="-22" y2="108"/>
        <line class="actor" x1="0" y1="70" x2="22" y2="108"/>
        <text class="actor-label" x="0" y="134">AI Service</text>
        <text class="actor-label" x="0" y="152" font-weight="400" font-size="11">(LLM / Embeddings / Whisper)</text>
      </g>

      <!-- Email Provider -->
      <g transform="translate(1380,870)">
        <circle class="actor" cx="0" cy="0" r="18"/>
        <line class="actor" x1="0" y1="18" x2="0" y2="70"/>
        <line class="actor" x1="-28" y1="36" x2="28" y2="36"/>
        <line class="actor" x1="0" y1="70" x2="-22" y2="108"/>
        <line class="actor" x1="0" y1="70" x2="22" y2="108"/>
        <text class="actor-label" x="0" y="134">Email Provider</text>
      </g>

      <!-- ===================== USE CASES (left column) ===================== -->
      <!-- cx 540, ry 30 -->
      <ellipse class="uc" cx="540" cy="160" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="165">Manage Profile</text>

      <ellipse class="uc" cx="540" cy="240" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="245">Find Jobs</text>

      <ellipse class="uc" cx="540" cy="320" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="325">Apply to Job</text>

      <ellipse class="uc" cx="540" cy="400" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="405">Track Application</text>

      <ellipse class="uc" cx="540" cy="480" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="485">Respond to Offer</text>

      <ellipse class="uc" cx="540" cy="600" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="605">Manage Jobs</text>

      <ellipse class="uc" cx="540" cy="680" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="685">Review Applications</text>

      <ellipse class="uc" cx="540" cy="760" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="765">Shortlist Candidates</text>

      <ellipse class="uc" cx="540" cy="840" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="845">Send Outreach</text>

      <ellipse class="uc" cx="540" cy="920" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="925">Schedule Interview</text>

      <ellipse class="uc" cx="540" cy="1000" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="1005">Make Offer Decision</text>

      <ellipse class="uc" cx="540" cy="1080" rx="115" ry="30"/>
      <text class="uc-label" x="540" y="1085">Manage Team &amp; Company</text>

      <!-- ===================== AI-FACING USE CASES (right column) ===================== -->
      <ellipse class="uc-ai" cx="940" cy="200" rx="120" ry="30"/>
      <text class="uc-label" x="940" y="205">Analyze Resume Gap</text>

      <ellipse class="uc-ai" cx="940" cy="320" rx="120" ry="30"/>
      <text class="uc-label" x="940" y="325">Generate Job Draft</text>

      <ellipse class="uc-ai" cx="940" cy="440" rx="120" ry="30"/>
      <text class="uc-label" x="940" y="445">Score Candidates</text>

      <ellipse class="uc-ai" cx="940" cy="560" rx="120" ry="30"/>
      <text class="uc-label" x="940" y="565">Recruiter AI Chat</text>

      <ellipse class="uc-ai" cx="940" cy="680" rx="120" ry="30"/>
      <text class="uc-label" x="940" y="685">Transcribe Interview</text>

      <!-- ===================== ACTOR ↔ USE CASE LINKS ===================== -->
      <!-- Candidate -->
      <line class="link" x1="148" y1="170" x2="425" y2="160"/>
      <line class="link" x1="148" y1="180" x2="425" y2="240"/>
      <line class="link" x1="148" y1="190" x2="425" y2="320"/>
      <line class="link" x1="148" y1="200" x2="425" y2="400"/>
      <line class="link" x1="148" y1="210" x2="425" y2="480"/>

      <!-- Recruiter -->
      <line class="link" x1="148" y1="560" x2="425" y2="600"/>
      <line class="link" x1="148" y1="568" x2="425" y2="680"/>
      <line class="link" x1="148" y1="576" x2="425" y2="760"/>
      <line class="link" x1="148" y1="584" x2="425" y2="840"/>
      <line class="link" x1="148" y1="592" x2="425" y2="920"/>
      <line class="link" x1="148" y1="600" x2="425" y2="1000"/>
      <path class="link" d="M 148 608 Q 500 440 820 560"/>

      <!-- Company Admin: only extra link is Manage Team & Company.
           Admin inherits all Recruiter capabilities via generalization arrow below. -->
      <line class="link" x1="148" y1="990" x2="425" y2="1080"/>

      <!-- Generalization: Company Admin -> Recruiter (open triangle head) -->
      <line class="gen" x1="120" y1="970" x2="120" y2="678"/>
      <polygon class="gen-head" points="120,660 110,682 130,682"/>
      <text class="rel-label" x="155" y="824" text-anchor="start">inherits</text>

      <!-- AI Service (secondary actor) connects to AI-driven use cases -->
      <line class="link" x1="1352" y1="400" x2="1060" y2="200"/>
      <line class="link" x1="1352" y1="405" x2="1060" y2="320"/>
      <line class="link" x1="1352" y1="410" x2="1060" y2="440"/>
      <line class="link" x1="1352" y1="415" x2="1060" y2="560"/>
      <line class="link" x1="1352" y1="420" x2="1060" y2="680"/>

      <!-- Email Provider (secondary actor) direct to Send Outreach -->
      <line class="link" x1="1352" y1="870" x2="655" y2="840"/>

      <!-- ===================== INCLUDE / EXTEND RELATIONSHIPS ===================== -->
      <!-- Apply to Job <<include>> Analyze Resume Gap -->
      <line class="rel" x1="655" y1="320" x2="820" y2="200" marker-end="url(#arrow)"/>
      <text class="rel-label" x="730" y="248">&lt;&lt;include&gt;&gt;</text>

      <!-- Manage Jobs <<extend>> Generate Job Draft (extension points at create) -->
      <line class="rel" x1="655" y1="600" x2="820" y2="320" marker-end="url(#arrow)"/>
      <text class="rel-label" x="735" y="448">&lt;&lt;extend&gt;&gt;</text>

      <!-- Shortlist Candidates <<include>> Score Candidates -->
      <line class="rel" x1="655" y1="760" x2="820" y2="440" marker-end="url(#arrow)"/>
      <text class="rel-label" x="735" y="592">&lt;&lt;include&gt;&gt;</text>

      <!-- Schedule Interview <<extend>> Transcribe Interview -->
      <line class="rel" x1="655" y1="920" x2="820" y2="680" marker-end="url(#arrow)"/>
      <text class="rel-label" x="735" y="788">&lt;&lt;extend&gt;&gt;</text>
    </svg>
  </div>
</body>
</html>
