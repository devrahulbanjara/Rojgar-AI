<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body{margin:0;padding:0;background:#fff;font-family:Inter,system-ui,sans-serif}
  svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <linearGradient id="gStatic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gStaticDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="gDyn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <symbol id="coin" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#b45309" stroke-width="1.2"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" font-weight="900" fill="#7c2d12">$</text>
    </symbol>

    <symbol id="coinStack" viewBox="0 0 90 60">
      <ellipse cx="22" cy="50" rx="18" ry="6" fill="#b45309"/>
      <rect x="4" y="20" width="36" height="30" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="22" cy="20" rx="18" ry="6" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="55" cy="50" rx="14" ry="5" fill="#b45309"/>
      <rect x="41" y="28" width="28" height="22" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="55" cy="28" rx="14" ry="5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="78" cy="50" rx="10" ry="4" fill="#b45309"/>
      <rect x="68" y="35" width="20" height="15" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="78" cy="35" rx="10" ry="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
    </symbol>

    <symbol id="piggy" viewBox="0 0 80 60">
      <ellipse cx="42" cy="40" rx="32" ry="18" fill="#f9a8d4" stroke="#be185d" stroke-width="2"/>
      <circle cx="60" cy="34" r="3" fill="#831843"/>
      <path d="M68 38 Q76 36 76 30" fill="none" stroke="#be185d" stroke-width="2"/>
      <rect x="68" y="36" width="10" height="6" rx="2" fill="#f472b6" stroke="#be185d" stroke-width="1.5"/>
      <rect x="38" y="20" width="12" height="3" rx="1" fill="#831843"/>
      <rect x="24" y="56" width="6" height="6" fill="#be185d"/>
      <rect x="54" y="56" width="6" height="6" fill="#be185d"/>
    </symbol>
  </defs>

  <text x="600" y="38" text-anchor="middle" fill="#1a2240" font-size="22" font-weight="900">Prompt caching: static prefix billed once</text>

  <!-- Legend -->
  <g font-size="11" font-weight="700">
    <rect x="320" y="58" width="18" height="12" fill="url(#gStatic)" stroke="#6366f1"/>
    <text x="344" y="68" fill="#1e1b4b">JD + rubric (static)</text>
    <rect x="500" y="58" width="18" height="12" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="524" y="68" fill="#7c2d12">resume (changes)</text>
    <rect x="680" y="58" width="18" height="12" fill="url(#gStaticDim)" stroke="#6366f1" stroke-dasharray="4 3"/>
    <text x="704" y="68" fill="#1e1b4b">cache hit at 0.1× rate</text>
  </g>

  <!-- WITHOUT -->
  <text x="80" y="108" fill="#7f1d1d" font-size="15" font-weight="900">WITHOUT</text>
  <g font-size="13" font-weight="700">
    <text x="40" y="148" fill="#5b6788" font-size="11">#1</text>
    <rect x="62" y="132" width="320" height="22" fill="url(#gStatic)" stroke="#6366f1"/>
    <rect x="382" y="132" width="80" height="22" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="478" y="148" fill="#7f1d1d">3,000</text>

    <text x="40" y="180" fill="#5b6788" font-size="11">#2</text>
    <rect x="62" y="164" width="320" height="22" fill="url(#gStatic)" stroke="#6366f1"/>
    <rect x="382" y="164" width="80" height="22" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="478" y="180" fill="#7f1d1d">3,000</text>

    <text x="40" y="212" fill="#5b6788" font-size="11">#3</text>
    <rect x="62" y="196" width="320" height="22" fill="url(#gStatic)" stroke="#6366f1"/>
    <rect x="382" y="196" width="80" height="22" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="478" y="212" fill="#7f1d1d">3,000</text>

    <text x="240" y="244" text-anchor="middle" fill="#7f1d1d" font-size="20" font-weight="800">⋮</text>

    <rect x="62" y="260" width="430" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <use href="#coinStack" x="72" y="266" width="60" height="28"/>
    <text x="290" y="285" text-anchor="middle" fill="#7f1d1d" font-size="14" font-weight="900">100 × 3,000 = 300,000 tok</text>
  </g>

  <!-- WITH -->
  <text x="680" y="108" fill="#14532d" font-size="15" font-weight="900">WITH CACHING</text>
  <g font-size="13" font-weight="700">
    <text x="640" y="148" fill="#5b6788" font-size="11">#1</text>
    <rect x="662" y="132" width="320" height="22" fill="url(#gStatic)" stroke="#6366f1"/>
    <rect x="982" y="132" width="80" height="22" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="1078" y="148" fill="#14532d">3,000</text>
    <text x="822" y="148" text-anchor="middle" fill="#1e1b4b" font-size="11" font-weight="900">write</text>

    <text x="640" y="180" fill="#5b6788" font-size="11">#2</text>
    <rect x="662" y="164" width="320" height="22" fill="url(#gStaticDim)" stroke="#6366f1" stroke-dasharray="4 3"/>
    <rect x="982" y="164" width="80" height="22" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="1078" y="180" fill="#14532d">840</text>
    <text x="822" y="180" text-anchor="middle" fill="#1e1b4b" font-size="11" font-weight="900">hit</text>

    <text x="640" y="212" fill="#5b6788" font-size="11">#3</text>
    <rect x="662" y="196" width="320" height="22" fill="url(#gStaticDim)" stroke="#6366f1" stroke-dasharray="4 3"/>
    <rect x="982" y="196" width="80" height="22" fill="url(#gDyn)" stroke="#d97706"/>
    <text x="1078" y="212" fill="#14532d">840</text>
    <text x="822" y="212" text-anchor="middle" fill="#1e1b4b" font-size="11" font-weight="900">hit</text>

    <text x="840" y="244" text-anchor="middle" fill="#14532d" font-size="20" font-weight="800">⋮</text>

    <rect x="662" y="260" width="430" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <use href="#coin" x="672" y="266" width="28" height="28"/>
    <text x="890" y="285" text-anchor="middle" fill="#14532d" font-size="14" font-weight="900">~86,000 tok</text>
  </g>

  <!-- piggy savings -->
  <g transform="translate(420,340)">
    <rect width="360" height="80" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <use href="#piggy" x="18" y="14" width="80" height="60"/>
    <text x="230" y="40" text-anchor="middle" fill="#7c2d12" font-size="20" font-weight="900">~71% saved</text>
    <text x="230" y="62" text-anchor="middle" fill="#92400e" font-size="12">cached prefix reused at 0.1× rate</text>
  </g>
</svg>
</body></html>
