<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="gapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <style>
      .col-hdr { font-size: 16px; font-weight: 700; }
      .gap-title { font-size: 17px; font-weight: 700; fill: #7f1d1d; }
      .gap-body { font-size: 14px; fill: #334155; }
      .gap-src { font-size: 12.5px; font-style: italic; fill: #64748b; }
    </style>
  </defs>

  <text x="360" y="38" text-anchor="middle" class="col-hdr" fill="#991b1b">GAPS IN THE LITERATURE</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="60" width="640" height="150" rx="10" fill="url(#gapGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="58" y="92" class="gap-title">LLM token cost gets insane at scale</text>
    <text x="58" y="122" class="gap-body">100+ candidates per job means a lot of tokens,</text>
    <text x="58" y="144" class="gap-body">and the papers don't say when to stop the loop.</text>
    <text x="58" y="186" class="gap-src">Lo et al. [1], Du et al. [5], Filatova et al. [13], Ong et al. [4]</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="230" width="640" height="150" rx="10" fill="url(#gapGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="58" y="262" class="gap-title">Bias hides in identifiers</text>
    <text x="58" y="292" class="gap-body">Names, emails, phone numbers and URLs leak</text>
    <text x="58" y="314" class="gap-body">gender, ethnicity and nationality signals.</text>
    <text x="58" y="356" class="gap-src">Fabris et al. [10] (survey of 250+ hiring tools)</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="40" y="400" width="640" height="150" rx="10" fill="url(#gapGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="58" y="432" class="gap-title">Recruiters just click approve on AI scores</text>
    <text x="58" y="462" class="gap-body">If only a number is shown, recruiters tend to</text>
    <text x="58" y="484" class="gap-body">go with the AI even when it's wrong.</text>
    <text x="58" y="526" class="gap-src">Peng et al. [9], Filatova et al. [13]</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="40" y="570" width="640" height="150" rx="10" fill="url(#gapGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="58" y="602" class="gap-title">Hybrid retrieval only tested one way</text>
    <text x="58" y="632" class="gap-body">Dense + sparse beats either alone, but the papers</text>
    <text x="58" y="654" class="gap-body">show it on single-direction search benchmarks.</text>
    <text x="58" y="696" class="gap-src">Rosenberger et al. [2], Hsu and Tzeng [3]</text>
  </g>

  <!-- Row 5 -->
  <g>
    <rect x="40" y="740" width="640" height="150" rx="10" fill="url(#gapGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="58" y="772" class="gap-title">Resume text can carry prompt injections</text>
    <text x="58" y="802" class="gap-body">Candidates write the resume, so any single-layer</text>
    <text x="58" y="824" class="gap-body">defence can be bypassed with crafted text.</text>
    <text x="58" y="866" class="gap-src">Liu et al. [6, 14], Sharma et al. [7]</text>
  </g>
</svg>
