<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body{margin:0;padding:0;background:#fff;font-family:Inter,system-ui,sans-serif}
  svg{display:block}
</style></head><body>
<svg width="1100" height="1180" viewBox="0 0 1100 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2240"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/>
    </linearGradient>

    <symbol id="doc" viewBox="0 0 40 50">
      <rect x="2" y="2" width="36" height="46" rx="3" fill="#fff" stroke="#5b6788" stroke-width="1.5"/>
      <line x1="8" y1="14" x2="32" y2="14" stroke="#94a3c4" stroke-width="1.6"/>
      <line x1="8" y1="22" x2="32" y2="22" stroke="#94a3c4" stroke-width="1.6"/>
      <line x1="8" y1="30" x2="26" y2="30" stroke="#94a3c4" stroke-width="1.6"/>
      <line x1="8" y1="38" x2="22" y2="38" stroke="#94a3c4" stroke-width="1.6"/>
    </symbol>
    <symbol id="db" viewBox="0 0 60 60">
      <ellipse cx="30" cy="10" rx="26" ry="8" fill="#1a2240" stroke="#1a2240"/>
      <path d="M4 10 V50 A26 8 0 0 0 56 50 V10" fill="#1a2240" stroke="#1a2240"/>
      <ellipse cx="30" cy="10" rx="26" ry="8" fill="none" stroke="#3b4a78"/>
      <ellipse cx="30" cy="26" rx="26" ry="8" fill="none" stroke="#3b4a78"/>
      <ellipse cx="30" cy="42" rx="26" ry="8" fill="none" stroke="#3b4a78"/>
    </symbol>
  </defs>

  <text x="550" y="34" text-anchor="middle" fill="#1a2240" font-size="22" font-weight="800">Shortlisting Pipeline</text>

  <!-- Job Expires -->
  <g transform="translate(400,60)">
    <rect width="300" height="50" rx="12" fill="#1a2240"/>
    <text x="150" y="32" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Job Expires</text>
  </g>
  <path d="M550 110 V140" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Applications -->
  <g transform="translate(340,150)">
    <use href="#doc" x="0" y="0" width="32" height="40"/>
    <use href="#doc" x="50" y="0" width="32" height="40"/>
    <use href="#doc" x="100" y="0" width="32" height="40"/>
    <use href="#doc" x="150" y="0" width="32" height="40"/>
    <use href="#doc" x="200" y="0" width="32" height="40"/>
    <use href="#doc" x="250" y="0" width="32" height="40"/>
    <use href="#doc" x="300" y="0" width="32" height="40"/>
    <use href="#doc" x="350" y="0" width="32" height="40"/>
    <text x="190" y="62" text-anchor="middle" fill="#5b6788" font-size="12" font-weight="600">N Applications</text>
  </g>
  <path d="M550 230 V260" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- ML Pre-Filter -->
  <g transform="translate(280,270)">
    <rect width="540" height="90" rx="14" fill="url(#gAmber)" stroke="#f59e0b" stroke-width="2"/>
    <text x="270" y="30" text-anchor="middle" fill="#7c2d12" font-size="17" font-weight="800">ML Pre-Filter</text>
    <g font-size="12" fill="#92400e">
      <rect x="20" y="46" width="150" height="26" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="95" y="63" text-anchor="middle" font-weight="600">years experience</text>
      <rect x="185" y="46" width="150" height="26" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="260" y="63" text-anchor="middle" font-weight="600">skills match</text>
      <rect x="350" y="46" width="170" height="26" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="435" y="63" text-anchor="middle" font-weight="600">cosine similarity</text>
    </g>
  </g>
  <path d="M550 360 V390" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="640" y="380" fill="#7c2d12" font-size="12" font-weight="700">drop bottom 80%</text>

  <!-- Top 20% -->
  <g transform="translate(420,400)">
    <use href="#doc" x="0" y="0" width="32" height="40"/>
    <use href="#doc" x="50" y="0" width="32" height="40"/>
    <use href="#doc" x="100" y="0" width="32" height="40"/>
    <use href="#doc" x="150" y="0" width="32" height="40"/>
    <text x="115" y="62" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="700">Top 20%</text>
  </g>
  <path d="M550 480 V508" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Guardrails box — standalone, outside loop -->
  <g transform="translate(380,518)">
    <rect width="340" height="50" rx="12" fill="url(#gRed)" stroke="#dc2626" stroke-width="1.8"/>
    <rect x="14" y="10" width="30" height="30" rx="6" fill="#fff" stroke="#dc2626"/>
    <text x="29" y="30" text-anchor="middle" font-size="15">🛡</text>
    <text x="120" y="31" fill="#7f1d1d" font-size="14" font-weight="700">Guardrails</text>
  </g>
  <path d="M550 568 V596" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Multi-Agent Loop container -->
  <g transform="translate(60,606)">
    <rect width="980" height="380" rx="16" fill="#f1f4ff" stroke="#c7cfe5" stroke-dasharray="6 5" stroke-width="1.5"/>
    <text x="20" y="28" fill="#1a2240" font-size="16" font-weight="800">Multi-Agent Critique Loop</text>

    <!-- one resume -->
    <g transform="translate(40,50)">
      <use href="#doc" x="0" y="0" width="40" height="50"/>
      <text x="20" y="66" text-anchor="middle" fill="#1a2240" font-size="12" font-weight="600">one resume</text>
    </g>
    <path d="M88 75 L170 75" stroke="#1a2240" stroke-width="2" fill="none"/>
    <path d="M170 75 V120 L230 120" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M170 75 V230 L230 230" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="190" y="68" font-size="11" fill="#5b6788" font-style="italic">parallel</text>

    <!-- CTO Agent -->
    <g transform="translate(230,95)">
      <rect width="220" height="55" rx="12" fill="url(#gBlue)" stroke="#2563eb" stroke-width="1.8"/>
      <rect x="12" y="12" width="32" height="32" rx="6" fill="#fff" stroke="#2563eb"/>
      <text x="28" y="33" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">T</text>
      <text x="118" y="33" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">CTO Agent</text>
    </g>

    <!-- HR Agent -->
    <g transform="translate(230,205)">
      <rect width="220" height="55" rx="12" fill="url(#gGreen)" stroke="#16a34a" stroke-width="1.8"/>
      <rect x="12" y="12" width="32" height="32" rx="6" fill="#fff" stroke="#16a34a"/>
      <text x="28" y="33" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">H</text>
      <text x="118" y="33" text-anchor="middle" fill="#14532d" font-size="14" font-weight="700">HR Agent</text>
    </g>

    <!-- web search badges -->
    <g transform="translate(345,152)">
      <rect width="105" height="20" rx="8" fill="#fff" stroke="#5b6788"/>
      <text x="52" y="14" text-anchor="middle" font-size="10" fill="#1a2240" font-weight="600">web search</text>
    </g>
    <g transform="translate(345,263)">
      <rect width="105" height="20" rx="8" fill="#fff" stroke="#5b6788"/>
      <text x="52" y="14" text-anchor="middle" font-size="10" fill="#1a2240" font-weight="600">web search</text>
    </g>

    <!-- arrows to critique -->
    <path d="M450 122 L560 175" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M450 232 L560 185" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

    <!-- Critique -->
    <g transform="translate(560,148)">
      <rect width="180" height="65" rx="12" fill="url(#gPurple)" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="90" y="29" text-anchor="middle" fill="#3b1d6f" font-size="14" font-weight="800">Critique</text>
      <text x="90" y="50" text-anchor="middle" fill="#3b1d6f" font-size="11">conf 0..1</text>
    </g>

    <!-- arrow to diamond -->
    <path d="M740 180 L772 195" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

    <!-- decision diamond -->
    <g transform="translate(772,165)">
      <polygon points="0,30 55,0 110,30 55,60" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="55" y="26" text-anchor="middle" fill="#3b1d6f" font-size="11" font-weight="700">conf</text>
      <text x="55" y="42" text-anchor="middle" fill="#3b1d6f" font-size="11" font-weight="700">&gt;= 0.7?</text>
    </g>

    <!-- yes -->
    <path d="M882 195 L916 195 L916 325 L480 325" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ahg)"/>
    <text x="900" y="187" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="800">yes</text>

    <!-- no retry — exits top of diamond -->
    <polygon points="827,143 819,157 835,157" fill="#dc2626"/>
    <path d="M827 153 L827 48 L170 48 L170 68" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ahr)"/>
    <text x="850" y="150" fill="#dc2626" font-size="12" font-weight="800">no, retry</text>
    <text x="500" y="40" text-anchor="middle" fill="#dc2626" font-size="11">max 1 retry</text>

    <!-- Final Merge -->
    <g transform="translate(230,305)">
      <rect width="250" height="55" rx="12" fill="url(#gCyan)" stroke="#06b6d4" stroke-width="1.8"/>
      <text x="125" y="32" text-anchor="middle" fill="#0e4f5b" font-size="14" font-weight="700">Final Merge</text>
    </g>
  </g>

  <path d="M550 986 V1016" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Persist Result -->
  <g transform="translate(280,1026)">
    <rect width="540" height="100" rx="14" fill="#1a2240"/>
    <text x="270" y="30" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Persist Result</text>
    <text x="270" y="54" text-anchor="middle" fill="#a8b2cc" font-size="12">status: shortlisted | rejected</text>
    <text x="270" y="74" text-anchor="middle" fill="#a8b2cc" font-size="12">strengths + concerns + score saved</text>
    <use href="#db" x="450" y="22" width="70" height="60"/>
  </g>

</svg>
</body></html>
