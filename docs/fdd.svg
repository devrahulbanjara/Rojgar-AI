<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 540" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0070f3"/>
    </marker>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>

  <text x="650" y="36" text-anchor="middle" fill="#0a3d91" font-size="22" font-weight="800">Functional Decomposition Diagram</text>

  <!-- Root -->
  <g transform="translate(490,70)">
    <rect width="320" height="80" rx="16" fill="#fff" stroke="#0a3d91" stroke-width="2"/>
    <text x="160" y="38" text-anchor="middle" fill="#0a3d91" font-size="17" font-weight="800">Rojgar AI</text>
    <text x="160" y="60" text-anchor="middle" fill="#5b6788" font-size="12">AI-augmented recruitment platform</text>
  </g>

  <!-- Trunk and bracket connectors -->
  <path d="M650 150 V200" stroke="#0070f3" stroke-width="2" fill="none"/>
  <path d="M205 200 L1105 200" stroke="#0070f3" stroke-width="2" fill="none"/>
  <path d="M205 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M355 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M505 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M655 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M805 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M955 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M1105 200 V270" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- S1 Auth -->
  <g transform="translate(125,275)">
    <rect width="160" height="160" rx="14" fill="url(#gIndigo)" stroke="#6366f1" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#6366f1"/>
    <text x="34" y="30" text-anchor="middle" fill="#1e1b4b" font-size="12" font-weight="800">S1</text>
    <text x="80" y="60" text-anchor="middle" fill="#1e1b4b" font-size="13" font-weight="700">Auth and User</text>
    <text x="80" y="78" text-anchor="middle" fill="#1e1b4b" font-size="13" font-weight="700">Management</text>
    <text x="80" y="108" text-anchor="middle" fill="#4338ca" font-size="11">sign-up and login</text>
    <text x="80" y="124" text-anchor="middle" fill="#4338ca" font-size="11">company team access</text>
    <text x="80" y="140" text-anchor="middle" fill="#4338ca" font-size="11">role-based permissions</text>
  </g>

  <!-- S2 ML + Multi-Agent -->
  <g transform="translate(275,275)">
    <rect width="160" height="160" rx="14" fill="url(#gAmber)" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#f59e0b"/>
    <text x="34" y="30" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="800">S2</text>
    <text x="80" y="60" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="700">ML and</text>
    <text x="80" y="78" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="700">Multi-Agent Shortlist</text>
    <text x="80" y="108" text-anchor="middle" fill="#92400e" font-size="11">fast resume pre-screen</text>
    <text x="80" y="124" text-anchor="middle" fill="#92400e" font-size="11">multi-persona AI debate</text>
    <text x="80" y="140" text-anchor="middle" fill="#92400e" font-size="11">auditable shortlist</text>
  </g>

  <!-- S3 Recruiter Chat -->
  <g transform="translate(425,275)">
    <rect width="160" height="160" rx="14" fill="url(#gCyan)" stroke="#06b6d4" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#06b6d4"/>
    <text x="34" y="30" text-anchor="middle" fill="#0e4f5b" font-size="12" font-weight="800">S3</text>
    <text x="80" y="60" text-anchor="middle" fill="#0e4f5b" font-size="13" font-weight="700">Recruiter Chatbot</text>
    <text x="80" y="78" text-anchor="middle" fill="#0e4f5b" font-size="13" font-weight="700">with Agentic Retrieval</text>
    <text x="80" y="108" text-anchor="middle" fill="#0e7490" font-size="11">understands recruiter intent</text>
    <text x="80" y="124" text-anchor="middle" fill="#0e7490" font-size="11">searches live platform data</text>
    <text x="80" y="140" text-anchor="middle" fill="#0e7490" font-size="11">streams replies live</text>
  </g>

  <!-- S4 Resume Gap -->
  <g transform="translate(575,275)">
    <rect width="160" height="160" rx="14" fill="url(#gGreen)" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="34" y="30" text-anchor="middle" fill="#14532d" font-size="12" font-weight="800">S4</text>
    <text x="80" y="60" text-anchor="middle" fill="#14532d" font-size="13" font-weight="700">Resume Parsing</text>
    <text x="80" y="78" text-anchor="middle" fill="#14532d" font-size="13" font-weight="700">and Gap Analysis</text>
    <text x="80" y="108" text-anchor="middle" fill="#166534" font-size="11">structured resume extract</text>
    <text x="80" y="124" text-anchor="middle" fill="#166534" font-size="11">gap detection vs job</text>
    <text x="80" y="140" text-anchor="middle" fill="#166534" font-size="11">candidate confirms edits</text>
  </g>

  <!-- S5 ASR -->
  <g transform="translate(725,275)">
    <rect width="160" height="160" rx="14" fill="url(#gPurple)" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#7c3aed"/>
    <text x="34" y="30" text-anchor="middle" fill="#3b1d6f" font-size="12" font-weight="800">S5</text>
    <text x="80" y="60" text-anchor="middle" fill="#3b1d6f" font-size="13" font-weight="700">ASR Interview</text>
    <text x="80" y="78" text-anchor="middle" fill="#3b1d6f" font-size="13" font-weight="700">Transcription</text>
    <text x="80" y="108" text-anchor="middle" fill="#4c1d95" font-size="11">Nepali speech to text</text>
    <text x="80" y="124" text-anchor="middle" fill="#4c1d95" font-size="11">transcribes interviews</text>
    <text x="80" y="140" text-anchor="middle" fill="#4c1d95" font-size="11">scores candidate answers</text>
  </g>

  <!-- S6 Job Drafting + Search -->
  <g transform="translate(875,275)">
    <rect width="160" height="160" rx="14" fill="url(#gPink)" stroke="#ec4899" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#ec4899"/>
    <text x="34" y="30" text-anchor="middle" fill="#831843" font-size="12" font-weight="800">S6</text>
    <text x="80" y="60" text-anchor="middle" fill="#831843" font-size="13" font-weight="700">Job Drafting and</text>
    <text x="80" y="78" text-anchor="middle" fill="#831843" font-size="13" font-weight="700">Hybrid Search</text>
    <text x="80" y="108" text-anchor="middle" fill="#9d174d" font-size="11">AI drafts job posts</text>
    <text x="80" y="124" text-anchor="middle" fill="#9d174d" font-size="11">keyword + meaning search</text>
    <text x="80" y="140" text-anchor="middle" fill="#9d174d" font-size="11">best matches first</text>
  </g>

  <!-- S7 Outreach -->
  <g transform="translate(1025,275)">
    <rect width="160" height="160" rx="14" fill="url(#gBlue)" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="14" y="14" width="40" height="22" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="34" y="30" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="800">S7</text>
    <text x="80" y="60" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="700">Outreach and</text>
    <text x="80" y="78" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="700">Interview Scheduling</text>
    <text x="80" y="108" text-anchor="middle" fill="#1d4ed8" font-size="11">drafts outreach emails</text>
    <text x="80" y="124" text-anchor="middle" fill="#1d4ed8" font-size="11">recruiter approves send</text>
    <text x="80" y="140" text-anchor="middle" fill="#1d4ed8" font-size="11">books interview slots</text>
  </g>

</svg>
