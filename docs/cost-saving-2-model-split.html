<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body{margin:0;padding:0;background:#fff;font-family:Inter,system-ui,sans-serif}
  svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>

    <symbol id="coin" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#b45309" stroke-width="1.2"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" font-weight="900" fill="#7c2d12">$</text>
    </symbol>

    <symbol id="coinStack" viewBox="0 0 90 60">
      <ellipse cx="22" cy="50" rx="18" ry="6" fill="#b45309"/>
      <rect x="4" y="20" width="36" height="30" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="22" cy="20" rx="18" ry="6" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="55" cy="50" rx="14" ry="5" fill="#b45309"/>
      <rect x="41" y="28" width="28" height="22" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="55" cy="28" rx="14" ry="5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="78" cy="50" rx="10" ry="4" fill="#b45309"/>
      <rect x="68" y="35" width="20" height="15" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="78" cy="35" rx="10" ry="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
    </symbol>

    <symbol id="brainBig" viewBox="0 0 70 60">
      <path d="M10 30 Q10 12 25 12 Q35 5 45 12 Q60 12 60 30 Q60 48 45 48 Q35 55 25 48 Q10 48 10 30 Z" fill="#7c3aed" stroke="#3b0764" stroke-width="2"/>
      <path d="M35 14 V46" stroke="#3b0764" stroke-width="1.5" fill="none"/>
      <path d="M22 22 Q28 26 22 30 Q28 34 22 38" fill="none" stroke="#3b0764" stroke-width="1.4"/>
      <path d="M48 22 Q42 26 48 30 Q42 34 48 38" fill="none" stroke="#3b0764" stroke-width="1.4"/>
    </symbol>

    <symbol id="brainSmall" viewBox="0 0 50 40">
      <path d="M8 20 Q8 8 18 8 Q25 4 32 8 Q42 8 42 20 Q42 32 32 32 Q25 36 18 32 Q8 32 8 20 Z" fill="#06b6d4" stroke="#083344" stroke-width="2"/>
      <path d="M25 9 V31" stroke="#083344" stroke-width="1.2" fill="none"/>
    </symbol>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#1a2240" font-size="22" font-weight="900">Right-sized model for each step</text>

  <!-- Sonnet (big) -->
  <g transform="translate(80,90)">
    <rect width="500" height="200" rx="14" fill="url(#gBlue)" stroke="#2563eb" stroke-width="2"/>
    <use href="#brainBig" x="30" y="40" width="110" height="100"/>
    <text x="170" y="60" fill="#1e3a8a" font-size="16" font-weight="900">Claude Sonnet 4.6</text>
    <text x="170" y="82" fill="#1e3a8a" font-size="13" font-weight="700">CTO · HR · Critique</text>
    <text x="170" y="104" fill="#1e3a8a" font-size="12">heavy reasoning, debate</text>
    <use href="#coinStack" x="380" y="120" width="100" height="60"/>
    <text x="285" y="180" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="800">$$$ but smart</text>
  </g>

  <!-- Haiku (small) -->
  <g transform="translate(620,90)">
    <rect width="500" height="200" rx="14" fill="url(#gCyan)" stroke="#06b6d4" stroke-width="2"/>
    <use href="#brainSmall" x="40" y="70" width="80" height="60"/>
    <text x="170" y="60" fill="#0e4f5b" font-size="16" font-weight="900">Claude Haiku 4.5</text>
    <text x="170" y="82" fill="#0e4f5b" font-size="13" font-weight="700">Final Merge only</text>
    <text x="170" y="104" fill="#0e4f5b" font-size="12">dedupe + format, no reasoning</text>
    <text x="285" y="140" text-anchor="middle" fill="#14532d" font-size="13" font-weight="800">cheap, fits the task</text>
    <use href="#coin" x="265" y="155" width="40" height="40"/>
  </g>
</svg>
</body></html>
