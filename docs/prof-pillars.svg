    <text x="105" y="78" text-anchor="middle" font-size="13" fill="#7c2d12">NP Privacy Act 2018</text>
    <text x="105" y="100" text-anchor="middle" font-size="13" fill="#7c2d12">GDPR Art 22</text>
    <text x="105" y="122" text-anchor="middle" font-size="13" fill="#7c2d12">EU AI Act, UK EA</text>
    <text x="105" y="200" text-anchor="middle" font-size="40">📜</text>
