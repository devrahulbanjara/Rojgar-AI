    <text x="105" y="78" text-anchor="middle" font-size="13" fill="#1e3a8a">fair, less nepotism</text>
    <text x="105" y="100" text-anchor="middle" font-size="13" fill="#1e3a8a">feedback to all</text>
    <text x="105" y="122" text-anchor="middle" font-size="13" fill="#1e3a8a">respectful rejection</text>
