    <text x="105" y="78" text-anchor="middle" font-size="13" fill="#3b1d6f">PII redacted</text>
    <text x="105" y="100" text-anchor="middle" font-size="13" fill="#3b1d6f">explainable scores</text>
    <text x="105" y="122" text-anchor="middle" font-size="13" fill="#3b1d6f">shared accountability</text>
