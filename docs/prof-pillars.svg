<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Inter, system-ui, Arial, sans-serif">
  <text x="600" y="38" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">Five Responsibility Pillars in ConvexHire</text>

  <g transform="translate(40,80)">
    <rect width="210" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="40" font-size="18" font-weight="700" fill="#0f172a">Social</text>
    <line x1="20" y1="54" x2="60" y2="54" stroke="#334155" stroke-width="2"/>
    <text x="20" y="90" font-size="13" fill="#475569">• fair, less nepotism</text>
    <text x="20" y="115" font-size="13" fill="#475569">• feedback to all</text>
    <text x="20" y="140" font-size="13" fill="#475569">• respectful rejection</text>
  </g>

  <g transform="translate(270,80)">
    <rect width="210" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="40" font-size="18" font-weight="700" fill="#0f172a">Ethical</text>
    <line x1="20" y1="54" x2="60" y2="54" stroke="#334155" stroke-width="2"/>
    <text x="20" y="90" font-size="13" fill="#475569">• PII redacted</text>
    <text x="20" y="115" font-size="13" fill="#475569">• explainable scores</text>
    <text x="20" y="140" font-size="13" fill="#475569">• shared accountability</text>
  </g>

  <g transform="translate(500,80)">
    <rect width="210" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="40" font-size="18" font-weight="700" fill="#0f172a">Legal</text>
    <line x1="20" y1="54" x2="60" y2="54" stroke="#334155" stroke-width="2"/>
    <text x="20" y="90" font-size="13" fill="#475569">• NP Privacy Act 2018</text>
    <text x="20" y="115" font-size="13" fill="#475569">• GDPR Art 22</text>
    <text x="20" y="140" font-size="13" fill="#475569">• EU AI Act, UK EA</text>
  </g>

  <g transform="translate(730,80)">
    <rect width="210" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="40" font-size="18" font-weight="700" fill="#0f172a">Security</text>
    <line x1="20" y1="54" x2="60" y2="54" stroke="#334155" stroke-width="2"/>
    <text x="20" y="90" font-size="13" fill="#475569">• encryption, RBAC</text>
    <text x="20" y="115" font-size="13" fill="#475569">• JWT + bcrypt</text>
    <text x="20" y="140" font-size="13" fill="#475569">• rate limit, guardrails</text>
  </g>

  <g transform="translate(960,80)">
    <rect width="210" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="40" font-size="18" font-weight="700" fill="#0f172a">Professional</text>
    <line x1="20" y1="54" x2="60" y2="54" stroke="#334155" stroke-width="2"/>
    <text x="20" y="90" font-size="13" fill="#475569">• BCS · ACM · IEEE</text>
    <text x="20" y="115" font-size="13" fill="#475569">• codes followed</text>
    <text x="20" y="140" font-size="13" fill="#475569">• audit log of choices</text>
  </g>
</svg>
