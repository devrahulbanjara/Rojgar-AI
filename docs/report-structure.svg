<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2240"/>
    </marker>
    <linearGradient id="gFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="gResearch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gProcess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gBuild" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="gVerify" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gRef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <text x="600" y="36" text-anchor="middle" fill="#1a2240" font-size="22" font-weight="800">Report Structure</text>

  <!-- Row 1: 01..04 left to right -->
  <g>
    <!-- 01 Introduction -->
    <rect x="60" y="80" width="240" height="80" rx="12" fill="url(#gFrame)" stroke="#6366f1" stroke-width="1.8"/>
    <text x="76" y="106" fill="#4338ca" font-size="11" font-weight="800">01</text>
    <text x="76" y="132" fill="#1e1b4b" font-size="15" font-weight="700">Introduction</text>

    <!-- 02 Literature Review -->
    <rect x="340" y="80" width="240" height="80" rx="12" fill="url(#gResearch)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="356" y="106" fill="#5b21b6" font-size="11" font-weight="800">02</text>
    <text x="356" y="132" fill="#3b1d6f" font-size="15" font-weight="700">Literature Review</text>

    <!-- 03 Methodology -->
    <rect x="620" y="80" width="240" height="80" rx="12" fill="url(#gProcess)" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="636" y="106" fill="#92400e" font-size="11" font-weight="800">03</text>
    <text x="636" y="132" fill="#7c2d12" font-size="15" font-weight="700">Methodology</text>

    <!-- 04 Tools and Tech -->
    <rect x="900" y="80" width="240" height="80" rx="12" fill="url(#gBuild)" stroke="#06b6d4" stroke-width="1.8"/>
    <text x="916" y="106" fill="#0e7490" font-size="11" font-weight="800">04</text>
    <text x="916" y="132" fill="#0e4f5b" font-size="15" font-weight="700">Tools and Tech</text>
  </g>
  <line x1="300" y1="120" x2="340" y2="120" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="580" y1="120" x2="620" y2="120" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="860" y1="120" x2="900" y2="120" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>

  <!-- down 4 to 5 (right side) -->
  <path d="M1020 160 V190" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Row 2: 05..08 right to left -->
  <g>
    <!-- 05 Artefact Designs -->
    <rect x="900" y="200" width="240" height="80" rx="12" fill="url(#gBuild)" stroke="#06b6d4" stroke-width="1.8"/>
    <text x="916" y="226" fill="#0e7490" font-size="11" font-weight="800">05</text>
    <text x="916" y="252" fill="#0e4f5b" font-size="15" font-weight="700">Artefact Designs</text>

    <!-- 06 Test Plans -->
    <rect x="620" y="200" width="240" height="80" rx="12" fill="url(#gVerify)" stroke="#16a34a" stroke-width="1.8"/>
    <text x="636" y="226" fill="#166534" font-size="11" font-weight="800">06</text>
    <text x="636" y="252" fill="#14532d" font-size="15" font-weight="700">Test Plans</text>

    <!-- 07 Security and Guardrails -->
    <rect x="340" y="200" width="240" height="80" rx="12" fill="url(#gVerify)" stroke="#16a34a" stroke-width="1.8"/>
    <text x="356" y="226" fill="#166534" font-size="11" font-weight="800">07</text>
    <text x="356" y="252" fill="#14532d" font-size="15" font-weight="700">Security and Guardrails</text>

    <!-- 08 Academic Question -->
    <rect x="60" y="200" width="240" height="80" rx="12" fill="url(#gResearch)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="76" y="226" fill="#5b21b6" font-size="11" font-weight="800">08</text>
    <text x="76" y="252" fill="#3b1d6f" font-size="15" font-weight="700">Academic Question</text>
  </g>
  <line x1="900" y1="240" x2="860" y2="240" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="620" y1="240" x2="580" y2="240" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="340" y1="240" x2="300" y2="240" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>

  <!-- down 8 to 9 (left side) -->
  <path d="M180 280 V310" stroke="#1a2240" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Row 3: 09..12 left to right -->
  <g>
    <!-- 09 Conclusion -->
    <rect x="60" y="320" width="240" height="80" rx="12" fill="url(#gFrame)" stroke="#6366f1" stroke-width="1.8"/>
    <text x="76" y="346" fill="#4338ca" font-size="11" font-weight="800">09</text>
    <text x="76" y="372" fill="#1e1b4b" font-size="15" font-weight="700">Conclusion</text>

    <!-- 10 Critical Evaluation -->
    <rect x="340" y="320" width="240" height="80" rx="12" fill="url(#gResearch)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="356" y="346" fill="#5b21b6" font-size="11" font-weight="800">10</text>
    <text x="356" y="372" fill="#3b1d6f" font-size="15" font-weight="700">Self-Reflection</text>

    <!-- 11 Project Management -->
    <rect x="620" y="320" width="240" height="80" rx="12" fill="url(#gProcess)" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="636" y="346" fill="#92400e" font-size="11" font-weight="800">11</text>
    <text x="636" y="372" fill="#7c2d12" font-size="15" font-weight="700">Project Management</text>

    <!-- 12 Appendices -->
    <rect x="900" y="320" width="240" height="80" rx="12" fill="url(#gRef)" stroke="#64748b" stroke-width="1.8"/>
    <text x="916" y="346" fill="#475569" font-size="11" font-weight="800">12</text>
    <text x="916" y="372" fill="#1e293b" font-size="15" font-weight="700">Appendices</text>
  </g>
  <line x1="300" y1="360" x2="340" y2="360" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="580" y1="360" x2="620" y2="360" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="860" y1="360" x2="900" y2="360" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
</svg>
