<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="findGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <style>
      .col-hdr { font-size: 16px; font-weight: 700; }
      .f-title { font-size: 17px; font-weight: 700; fill: #1e3a8a; }
      .f-body { font-size: 14px; fill: #1e293b; }
      .f-src { font-size: 12.5px; font-style: italic; fill: #64748b; }
    </style>
  </defs>

  <text x="360" y="38" text-anchor="middle" class="col-hdr" fill="#1e3a8a">KEY FINDINGS FROM THE LITERATURE</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="60" width="640" height="150" rx="10" fill="url(#findGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="92" class="f-title">Multi-agent debate beats single-model scoring</text>
    <text x="58" y="122" class="f-body">When agents critique each other, factual accuracy goes up.</text>
    <text x="58" y="144" class="f-body">Lo's 4-agent screener matched a skilled HR manager.</text>
    <text x="58" y="186" class="f-src">Du et al. [5], Lo et al. [1], Filatova et al. [13]</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="230" width="640" height="150" rx="10" fill="url(#findGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="262" class="f-title">Dense + sparse retrieval beats either alone</text>
    <text x="58" y="292" class="f-body">Embeddings catch meaning, BM25 catches exact terms</text>
    <text x="58" y="314" class="f-body">like cert names and library names. Fusion wins.</text>
    <text x="58" y="356" class="f-src">Rosenberger et al. [2], Hsu and Tzeng [3]</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="40" y="400" width="640" height="150" rx="10" fill="url(#findGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="432" class="f-title">Cheap pre-filter before expensive LLM saves cost</text>
    <text x="58" y="462" class="f-body">Routing easy cases to small models and only hard cases</text>
    <text x="58" y="484" class="f-body">to big models drops total inference cost a lot.</text>
    <text x="58" y="526" class="f-src">Ong et al. [4], windowed intent classification [11]</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="40" y="570" width="640" height="150" rx="10" fill="url(#findGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="602" class="f-title">Whisper fine-tuned on Nepali beats zero-shot</text>
    <text x="58" y="632" class="f-body">Zero-shot Whisper does badly on low-resource languages,</text>
    <text x="58" y="654" class="f-body">but fine-tuning on Nepali corpora cuts WER hard.</text>
    <text x="58" y="696" class="f-src">Ojha et al. [8], Whisper-LM [15]</text>
  </g>

  <!-- Row 5 -->
  <g>
    <rect x="40" y="740" width="640" height="150" rx="10" fill="url(#findGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="58" y="772" class="f-title">Layered guardrails beat any single defence</text>
    <text x="58" y="802" class="f-body">Prompt injection attacks bypass one filter. Hybrid rule</text>
    <text x="58" y="824" class="f-body">+ NER PII pipelines hit 91.1% F1 on unstructured docs.</text>
    <text x="58" y="866" class="f-src">Liu et al. [6, 14], Sharma et al. [7]</text>
  </g>
</svg>
