<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2240"/>
    </marker>
    <linearGradient id="gAI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="gHuman" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>

    <symbol id="iconRobot" viewBox="0 0 32 32">
      <line x1="16" y1="2" x2="16" y2="7" stroke="#3b1d6f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="2.5" r="1.5" fill="#3b1d6f"/>
      <rect x="5" y="8" width="22" height="18" rx="3" fill="none" stroke="#3b1d6f" stroke-width="2"/>
      <circle cx="12" cy="16" r="1.8" fill="#3b1d6f"/>
      <circle cx="20" cy="16" r="1.8" fill="#3b1d6f"/>
      <line x1="11" y1="22" x2="21" y2="22" stroke="#3b1d6f" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="14" x2="5" y2="14" stroke="#3b1d6f" stroke-width="2" stroke-linecap="round"/>
      <line x1="27" y1="14" x2="29" y2="14" stroke="#3b1d6f" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="iconPerson" viewBox="0 0 32 32">
      <circle cx="16" cy="10" r="5" fill="none" stroke="#14532d" stroke-width="2"/>
      <path d="M5 28 C 5 19, 27 19, 27 28" fill="none" stroke="#14532d" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <text x="600" y="38" text-anchor="middle" fill="#1a2240" font-size="22" font-weight="900">Human-in-the-Loop Gates Along the Funnel</text>

  <!-- Track line -->
  <line x1="60" y1="200" x2="1140" y2="200" stroke="#1a2240" stroke-width="3"/>

  <!-- Step 1 AI -->
  <g transform="translate(60,140)">
    <rect width="170" height="120" rx="12" fill="url(#gAI)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="85" y="32" text-anchor="middle" fill="#3b1d6f" font-size="12" font-weight="900">AI shortlists</text>
    <text x="85" y="54" text-anchor="middle" fill="#3b1d6f" font-size="11">CTO + HR + Critique</text>
    <text x="85" y="76" text-anchor="middle" fill="#3b1d6f" font-size="11">scores + evidence</text>
    <use href="#iconRobot" x="71" y="86" width="28" height="28"/>
  </g>

  <!-- Gate 1 human -->
  <g transform="translate(255,140)">
    <rect width="150" height="120" rx="12" fill="url(#gHuman)" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="32" text-anchor="middle" fill="#14532d" font-size="13" font-weight="900">RECRUITER</text>
    <text x="75" y="50" text-anchor="middle" fill="#14532d" font-size="13" font-weight="900">APPROVE</text>
    <text x="75" y="72" text-anchor="middle" fill="#166534" font-size="11">shortlist gate</text>
    <use href="#iconPerson" x="61" y="86" width="28" height="28"/>
  </g>

  <!-- Step 2 AI -->
  <g transform="translate(430,140)">
    <rect width="170" height="120" rx="12" fill="url(#gAI)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="85" y="32" text-anchor="middle" fill="#3b1d6f" font-size="12" font-weight="900">AI drafts outreach</text>
    <text x="85" y="54" text-anchor="middle" fill="#3b1d6f" font-size="11">personalized email</text>
    <text x="85" y="76" text-anchor="middle" fill="#3b1d6f" font-size="11">+ interview slot</text>
    <use href="#iconRobot" x="71" y="86" width="28" height="28"/>
  </g>

  <!-- Gate 2 -->
  <g transform="translate(625,140)">
    <rect width="150" height="120" rx="12" fill="url(#gHuman)" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="32" text-anchor="middle" fill="#14532d" font-size="13" font-weight="900">RECRUITER</text>
    <text x="75" y="50" text-anchor="middle" fill="#14532d" font-size="13" font-weight="900">APPROVE</text>
    <text x="75" y="72" text-anchor="middle" fill="#166534" font-size="11">email send gate</text>
    <use href="#iconPerson" x="61" y="86" width="28" height="28"/>
  </g>

  <!-- Step 3 AI -->
  <g transform="translate(800,140)">
    <rect width="170" height="120" rx="12" fill="url(#gAI)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="85" y="32" text-anchor="middle" fill="#3b1d6f" font-size="12" font-weight="900">AI scores interview</text>
    <text x="85" y="54" text-anchor="middle" fill="#3b1d6f" font-size="11">Whisper transcript</text>
    <text x="85" y="76" text-anchor="middle" fill="#3b1d6f" font-size="11">rubric evaluation</text>
    <use href="#iconRobot" x="71" y="86" width="28" height="28"/>
  </g>

  <!-- Gate 3 -->
  <g transform="translate(995,140)">
    <rect width="150" height="120" rx="12" fill="url(#gHuman)" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="32" text-anchor="middle" fill="#14532d" font-size="13" font-weight="900">RECRUITER</text>
    <text x="75" y="50" text-anchor="middle" fill="#14532d" font-size="13" font-weight="900">DECIDE</text>
    <text x="75" y="72" text-anchor="middle" fill="#166534" font-size="11">offer / reject gate</text>
    <use href="#iconPerson" x="61" y="86" width="28" height="28"/>
  </g>

  <!-- arrows on track -->
  <path d="M230 200 L255 200" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M405 200 L430 200" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M600 200 L625 200" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M775 200 L800 200" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M970 200 L995 200" stroke="#1a2240" stroke-width="2" marker-end="url(#ah)"/>

  <text x="600" y="330" text-anchor="middle" fill="#1a2240" font-size="14" font-weight="900">AI assists, never decides. GDPR Art 22 satisfied.</text>
</svg>
