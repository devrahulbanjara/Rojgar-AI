<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body{margin:0;padding:0;background:#fff;font-family:Inter,system-ui,sans-serif}
  svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gStatic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gStaticDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="gDyn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <symbol id="coin" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#b45309" stroke-width="1.2"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" font-weight="900" fill="#7c2d12">$</text>
    </symbol>

    <symbol id="coinStack" viewBox="0 0 90 60">
      <ellipse cx="22" cy="50" rx="18" ry="6" fill="#b45309"/>
      <rect x="4" y="20" width="36" height="30" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="22" cy="20" rx="18" ry="6" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="55" cy="50" rx="14" ry="5" fill="#b45309"/>
      <rect x="41" y="28" width="28" height="22" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="55" cy="28" rx="14" ry="5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="78" cy="50" rx="10" ry="4" fill="#b45309"/>
      <rect x="68" y="35" width="20" height="15" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="78" cy="35" rx="10" ry="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
    </symbol>

    <symbol id="piggy" viewBox="0 0 80 60">
      <ellipse cx="42" cy="40" rx="32" ry="18" fill="#f9a8d4" stroke="#be185d" stroke-width="2"/>
      <circle cx="60" cy="34" r="3" fill="#831843"/>
      <path d="M68 38 Q76 36 76 30" fill="none" stroke="#be185d" stroke-width="2"/>
      <rect x="68" y="36" width="10" height="6" rx="2" fill="#f472b6" stroke="#be185d" stroke-width="1.5"/>
      <rect x="38" y="20" width="12" height="3" rx="1" fill="#831843"/>
      <rect x="24" y="56" width="6" height="6" fill="#be185d"/>
      <rect x="54" y="56" width="6" height="6" fill="#be185d"/>
    </symbol>

    <!-- candidate icon -->
    <symbol id="person" viewBox="0 0 30 40">
      <circle cx="15" cy="10" r="6" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
      <path d="M3 36 Q3 22 15 22 Q27 22 27 36 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
    </symbol>

    <!-- small ML chip icon -->
    <symbol id="chip" viewBox="0 0 60 60">
      <rect x="12" y="12" width="36" height="36" rx="4" fill="#f59e0b" stroke="#7c2d12" stroke-width="2"/>
      <rect x="20" y="20" width="20" height="20" fill="#fef3c7" stroke="#7c2d12"/>
      <text x="30" y="35" text-anchor="middle" font-size="11" font-weight="900" fill="#7c2d12">RF</text>
      <line x1="6" y1="20" x2="12" y2="20" stroke="#7c2d12" stroke-width="2"/>
      <line x1="6" y1="30" x2="12" y2="30" stroke="#7c2d12" stroke-width="2"/>
      <line x1="6" y1="40" x2="12" y2="40" stroke="#7c2d12" stroke-width="2"/>
      <line x1="48" y1="20" x2="54" y2="20" stroke="#7c2d12" stroke-width="2"/>
      <line x1="48" y1="30" x2="54" y2="30" stroke="#7c2d12" stroke-width="2"/>
      <line x1="48" y1="40" x2="54" y2="40" stroke="#7c2d12" stroke-width="2"/>
    </symbol>

    <!-- brain icon (big LLM) -->
    <symbol id="brainBig" viewBox="0 0 70 60">
      <path d="M10 30 Q10 12 25 12 Q35 5 45 12 Q60 12 60 30 Q60 48 45 48 Q35 55 25 48 Q10 48 10 30 Z" fill="#7c3aed" stroke="#3b0764" stroke-width="2"/>
      <path d="M35 14 V46" stroke="#3b0764" stroke-width="1.5" fill="none"/>
      <path d="M22 22 Q28 26 22 30 Q28 34 22 38" fill="none" stroke="#3b0764" stroke-width="1.4"/>
      <path d="M48 22 Q42 26 48 30 Q42 34 48 38" fill="none" stroke="#3b0764" stroke-width="1.4"/>
    </symbol>

    <!-- brain small (cheap) -->
    <symbol id="brainSmall" viewBox="0 0 50 40">
      <path d="M8 20 Q8 8 18 8 Q25 4 32 8 Q42 8 42 20 Q42 32 32 32 Q25 36 18 32 Q8 32 8 20 Z" fill="#06b6d4" stroke="#083344" stroke-width="2"/>
      <path d="M25 9 V31" stroke="#083344" stroke-width="1.2" fill="none"/>
    </symbol>

    <!-- cache database -->
    <symbol id="cache" viewBox="0 0 60 60">
      <ellipse cx="30" cy="12" rx="22" ry="6" fill="#6366f1" stroke="#312e81" stroke-width="1.5"/>
      <path d="M8 12 V48 A22 6 0 0 0 52 48 V12" fill="#a5b4fc" stroke="#312e81" stroke-width="1.5"/>
      <ellipse cx="30" cy="48" rx="22" ry="6" fill="#6366f1" stroke="#312e81" stroke-width="1.5"/>
      <text x="30" y="34" text-anchor="middle" font-size="11" font-weight="900" fill="#1e1b4b">cache</text>
    </symbol>
  </defs>

  <text x="600" y="38" text-anchor="middle" fill="#1a2240" font-size="24" font-weight="900">Cost-Saving Strategy in Shortlisting</text>
  <text x="600" y="62" text-anchor="middle" fill="#5b6788" font-size="13">three layers of savings stacked on the same pipeline</text>

  <!-- ===== Layer 1: Cheap ML pre-filter ===== -->
  <g transform="translate(40,90)">
    <rect width="1120" height="200" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="32" fill="#7c2d12" font-size="16" font-weight="900">1 · Cheap ML pre-filter drops 80% before any LLM call</text>

    <!-- 100 candidates icons row -->
    <g transform="translate(40,60)">
      <text x="0" y="0" fill="#5b6788" font-size="12" font-weight="700">100 candidates</text>
      <g>
        <use href="#person" x="0" y="10" width="18" height="24"/>
        <use href="#person" x="22" y="10" width="18" height="24"/>
        <use href="#person" x="44" y="10" width="18" height="24"/>
        <use href="#person" x="66" y="10" width="18" height="24"/>
        <use href="#person" x="88" y="10" width="18" height="24"/>
        <use href="#person" x="110" y="10" width="18" height="24"/>
        <use href="#person" x="132" y="10" width="18" height="24"/>
        <use href="#person" x="154" y="10" width="18" height="24"/>
        <use href="#person" x="176" y="10" width="18" height="24"/>
        <use href="#person" x="198" y="10" width="18" height="24"/>
      </g>
    </g>

    <!-- arrow -->
    <path d="M310 90 L380 90" stroke="#7c2d12" stroke-width="3" marker-end="url(#ah)" fill="none"/>

    <!-- chip in middle -->
    <use href="#chip" x="390" y="70" width="60" height="60"/>
    <text x="420" y="150" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="800">RandomForest</text>
    <text x="420" y="166" text-anchor="middle" fill="#92400e" font-size="11">~0 cost</text>

    <!-- arrow -->
    <path d="M470 90 L540 90" stroke="#7c2d12" stroke-width="3" marker-end="url(#ah)" fill="none"/>

    <!-- 20 survivors -->
    <g transform="translate(560,60)">
      <text x="0" y="0" fill="#14532d" font-size="12" font-weight="700">top 20 reach LLM</text>
      <g>
        <use href="#person" x="0" y="10" width="18" height="24"/>
        <use href="#person" x="22" y="10" width="18" height="24"/>
        <use href="#person" x="44" y="10" width="18" height="24"/>
        <use href="#person" x="66" y="10" width="18" height="24"/>
        <use href="#person" x="88" y="10" width="18" height="24"/>
        <use href="#person" x="110" y="10" width="18" height="24"/>
        <use href="#person" x="132" y="10" width="18" height="24"/>
        <use href="#person" x="154" y="10" width="18" height="24"/>
      </g>
    </g>

    <!-- drop bin -->
    <g transform="translate(560,130)">
      <text x="0" y="0" fill="#7f1d1d" font-size="12" font-weight="700">80 dropped (no LLM cost)</text>
    </g>

    <!-- savings callout right -->
    <g transform="translate(870,55)">
      <rect width="220" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <use href="#coinStack" x="20" y="22" width="80" height="55"/>
      <text x="155" y="50" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="900">5× fewer</text>
      <text x="155" y="68" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="700">LLM calls</text>
      <text x="110" y="100" text-anchor="middle" fill="#92400e" font-size="11">100 → 20 per job</text>
    </g>
  </g>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c2d12"/>
    </marker>
  </defs>

  <!-- ===== Layer 2: Model split — big for thinking, small for merging ===== -->
  <g transform="translate(40,310)">
    <rect width="1120" height="220" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="20" y="32" fill="#3b0764" font-size="16" font-weight="900">2 · Big model for hard thinking, small model for the easy step</text>

    <!-- Sonnet box -->
    <g transform="translate(40,60)">
      <rect width="460" height="130" rx="12" fill="url(#gBlue)" stroke="#2563eb" stroke-width="2"/>
      <use href="#brainBig" x="20" y="24" width="80" height="80"/>
      <text x="120" y="48" fill="#1e3a8a" font-size="15" font-weight="900">Claude Sonnet 4.6</text>
      <text x="120" y="68" fill="#1e3a8a" font-size="12">CTO · HR · Critique</text>
      <text x="120" y="92" fill="#1e3a8a" font-size="11" font-weight="700">reasoning, judgement, debate</text>
      <use href="#coinStack" x="340" y="55" width="90" height="55"/>
      <text x="385" y="122" text-anchor="middle" fill="#7c2d12" font-size="11" font-weight="700">$$$ but smart</text>
    </g>

    <!-- Haiku box -->
    <g transform="translate(540,60)">
      <rect width="540" height="130" rx="12" fill="url(#gCyan)" stroke="#06b6d4" stroke-width="2"/>
      <use href="#brainSmall" x="20" y="40" width="60" height="50"/>
      <text x="100" y="48" fill="#0e4f5b" font-size="15" font-weight="900">Claude Haiku 4.5</text>
      <text x="100" y="68" fill="#0e4f5b" font-size="12">Final Merge only</text>
      <text x="100" y="92" fill="#0e4f5b" font-size="11" font-weight="700">dedupe + format, no reasoning</text>
      <use href="#coin" x="380" y="60" width="40" height="40"/>
      <text x="460" y="86" text-anchor="middle" fill="#14532d" font-size="12" font-weight="800">cheap, fits the task</text>
    </g>
  </g>

  <!-- ===== Layer 3: Prompt caching ===== -->
  <g transform="translate(40,550)">
    <rect width="1120" height="280" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="20" y="32" fill="#083344" font-size="16" font-weight="900">3 · Prompt caching: static prefix billed once, reused at 0.1× rate</text>

    <!-- 3 bars without -->
    <g transform="translate(40,60)">
      <text x="0" y="0" fill="#7f1d1d" font-size="13" font-weight="800">WITHOUT</text>
      <text x="0" y="20" fill="#5b6788" font-size="11">#1</text>
      <rect x="22" y="8" width="300" height="18" fill="url(#gStatic)" stroke="#6366f1"/>
      <rect x="322" y="8" width="70" height="18" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="402" y="22" fill="#7f1d1d" font-size="12" font-weight="700">3,000</text>

      <text x="0" y="50" fill="#5b6788" font-size="11">#2</text>
      <rect x="22" y="38" width="300" height="18" fill="url(#gStatic)" stroke="#6366f1"/>
      <rect x="322" y="38" width="70" height="18" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="402" y="52" fill="#7f1d1d" font-size="12" font-weight="700">3,000</text>

      <text x="0" y="80" fill="#5b6788" font-size="11">#3</text>
      <rect x="22" y="68" width="300" height="18" fill="url(#gStatic)" stroke="#6366f1"/>
      <rect x="322" y="68" width="70" height="18" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="402" y="82" fill="#7f1d1d" font-size="12" font-weight="700">3,000</text>

      <text x="200" y="108" text-anchor="middle" fill="#7f1d1d" font-size="18" font-weight="800">⋮</text>

      <rect x="22" y="120" width="370" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <use href="#coinStack" x="30" y="124" width="60" height="28"/>
      <text x="240" y="142" text-anchor="middle" fill="#7f1d1d" font-size="13" font-weight="800">100 × 3,000 = 300,000 tok</text>
    </g>

    <!-- cache db in middle -->
    <g transform="translate(490,110)">
      <use href="#cache" x="0" y="0" width="80" height="80"/>
    </g>

    <!-- 3 bars with -->
    <g transform="translate(620,60)">
      <text x="0" y="0" fill="#14532d" font-size="13" font-weight="800">WITH CACHING</text>
      <text x="0" y="20" fill="#5b6788" font-size="11">#1</text>
      <rect x="22" y="8" width="300" height="18" fill="url(#gStatic)" stroke="#6366f1"/>
      <rect x="322" y="8" width="70" height="18" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="402" y="22" fill="#14532d" font-size="12" font-weight="700">3,000</text>
      <text x="170" y="22" text-anchor="middle" fill="#1e1b4b" font-size="11" font-weight="800">write</text>

      <text x="0" y="50" fill="#5b6788" font-size="11">#2</text>
      <rect x="22" y="38" width="300" height="18" fill="url(#gStaticDim)" stroke="#6366f1" stroke-dasharray="4 3"/>
      <rect x="322" y="38" width="70" height="18" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="402" y="52" fill="#14532d" font-size="12" font-weight="700">840</text>
      <text x="170" y="52" text-anchor="middle" fill="#1e1b4b" font-size="11" font-weight="800">hit</text>

      <text x="0" y="80" fill="#5b6788" font-size="11">#3</text>
      <rect x="22" y="68" width="300" height="18" fill="url(#gStaticDim)" stroke="#6366f1" stroke-dasharray="4 3"/>
      <rect x="322" y="68" width="70" height="18" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="402" y="82" fill="#14532d" font-size="12" font-weight="700">840</text>
      <text x="170" y="82" text-anchor="middle" fill="#1e1b4b" font-size="11" font-weight="800">hit</text>

      <text x="200" y="108" text-anchor="middle" fill="#14532d" font-size="18" font-weight="800">⋮</text>

      <rect x="22" y="120" width="370" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <use href="#coin" x="30" y="125" width="24" height="24"/>
      <text x="240" y="142" text-anchor="middle" fill="#14532d" font-size="13" font-weight="800">~86,000 tok (~71% saved)</text>
    </g>

    <!-- legend -->
    <g transform="translate(40,230)" font-size="11" font-weight="700">
      <rect x="0" y="0" width="18" height="12" fill="url(#gStatic)" stroke="#6366f1"/>
      <text x="24" y="10" fill="#1e1b4b">JD + rubric (static)</text>
      <rect x="180" y="0" width="18" height="12" fill="url(#gDyn)" stroke="#d97706"/>
      <text x="204" y="10" fill="#7c2d12">resume (changes)</text>
      <rect x="360" y="0" width="18" height="12" fill="url(#gStaticDim)" stroke="#6366f1" stroke-dasharray="4 3"/>
      <text x="384" y="10" fill="#1e1b4b">cache hit at 0.1× rate</text>

      <use href="#piggy" x="700" y="-8" width="60" height="40"/>
      <text x="800" y="14" fill="#7c2d12" font-size="16" font-weight="900">huge savings, stacked</text>
    </g>
  </g>
</svg>
</body></html>
