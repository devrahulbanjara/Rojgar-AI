<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ConvexHire Gantt Chart</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e5e7eb;
    --line-strong: #cbd5e1;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --row-alt: #fafafa;
    --label-col: 320px;
    --row-h: 38px;
    --header-h: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1400px; margin: 32px auto; padding: 0 24px; }
  header { margin-bottom: 20px; }
  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .chart {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .chart-scroll { overflow-x: auto; }
  .chart-inner { min-width: 1000px; }

  .month-row {
    display: grid;
    grid-template-columns: var(--label-col) 1fr;
    border-bottom: 1px solid var(--line);
    background: #fafbfc;
    height: var(--header-h);
  }
  .month-row .corner { border-right: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .months { position: relative; }
  .months .m {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding-left: 8px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .months .m:first-child { border-left: none; }

  .row {
    display: grid;
    grid-template-columns: var(--label-col) 1fr;
    height: var(--row-h);
    border-bottom: 1px solid var(--line);
  }
  .row:nth-child(even) { background: var(--row-alt); }
  .row:last-child { border-bottom: none; }

  .label {
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-right: 1px solid var(--line);
    font-size: 13px;
    gap: 10px;
  }
  .label .sn {
    flex: 0 0 22px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: right;
  }
  .label .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .track {
    position: relative;
    background-image: repeating-linear-gradient(to right, transparent, transparent calc((100% / 9) - 1px), var(--line) calc((100% / 9) - 1px), var(--line) calc(100% / 9));
  }

  .bar {
    position: absolute;
    top: 8px;
    bottom: 8px;
    background: var(--accent);
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    color: white;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
  }
  .bar.soft { background: var(--accent-soft); color: var(--accent); }

  footer { margin-top: 16px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ConvexHire Gantt Chart</h1>
  </header>

  <div class="chart">
    <div class="chart-scroll">
      <div class="chart-inner">
        <div class="month-row">
          <div class="corner">Task</div>
          <div class="months" id="months"></div>
        </div>
        <div id="rows"></div>
      </div>
    </div>
  </div>

  <footer>
    <span id="totalDays"></span>
  </footer>
</div>

<script>
  const START = new Date("2025-09-04");
  const END = new Date("2026-05-13");
  const TOTAL = (END - START) / 86400000;

  const tasks = [
    [1, "Project setup and infrastructure", "2025-09-04", "2025-09-15"],
    [2, "Wireframing and design system", "2025-09-10", "2025-10-05"],
    [3, "Authentication and landing page", "2025-09-25", "2025-10-25"],
    [4, "Profiles, companies and team management", "2025-10-20", "2025-11-25"],
    [5, "Job creation and management", "2025-11-15", "2025-12-10"],
    [6, "Semantic search and find jobs", "2025-12-01", "2025-12-25"],
    [7, "Resume builder and apply flow", "2025-12-15", "2026-01-20"],
    [8, "Recruiter dashboards and operations", "2026-01-15", "2026-02-15"],
    [9, "Resume gap analysis and auto-patch", "2026-02-10", "2026-02-28"],
    [10, "AI job drafting and evaluation", "2026-02-20", "2026-03-15"],
    [11, "Shortlisting ML and multi-agent pipeline", "2026-03-10", "2026-04-05"],
    [12, "Whisper fine-tuning and interview transcription", "2026-04-01", "2026-04-15"],
    [13, "Outreach emails and interview booking", "2026-04-10", "2026-04-30"],
    [14, "Recruiter AI chat", "2026-04-20", "2026-05-03"],
    [15, "Hybrid search upgrade and evaluation", "2026-05-01", "2026-05-07"],
    [16, "Guardrails integration and final polish", "2026-05-07", "2026-05-13"],
  ];

  const months = [];
  let cursor = new Date(START.getFullYear(), START.getMonth(), 1);
  while (cursor <= END) {
    const next = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    const segStart = cursor < START ? START : cursor;
    const segEnd = next > END ? END : next;
    months.push({
      label: cursor.toLocaleString("en", { month: "short", year: "2-digit" }),
      left: ((segStart - START) / 86400000 / TOTAL) * 100,
      width: ((segEnd - segStart) / 86400000 / TOTAL) * 100,
    });
    cursor = next;
  }

  const monthsEl = document.getElementById("months");
  for (const m of months) {
    const div = document.createElement("div");
    div.className = "m";
    div.style.left = m.left + "%";
    div.style.width = m.width + "%";
    div.textContent = m.label;
    monthsEl.appendChild(div);
  }

  const rowsEl = document.getElementById("rows");
  for (const [sn, name, s, e] of tasks) {
    const startD = new Date(s);
    const endD = new Date(e);
    const left = ((startD - START) / 86400000 / TOTAL) * 100;
    const width = ((endD - startD) / 86400000 / TOTAL) * 100;
    const days = Math.round((endD - startD) / 86400000);

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="label"><span class="sn">${sn}</span><span class="name">${name}</span></div>
      <div class="track"><div class="bar" style="left:${left}%;width:${width}%" title="${s} → ${e} (${days}d)">${days}d</div></div>
    `;
    rowsEl.appendChild(row);
  }

  document.getElementById("totalDays").textContent = Math.round(TOTAL) + " days total";
</script>
</body>
</html>
