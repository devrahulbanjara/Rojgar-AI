services:
  postgres-test:
    image: postgres:16
    container_name: rojgarai-postgres-test
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rojgarai_test}
    ports:
      - "5433:5432"

  qdrant-test:
    image: qdrant/qdrant:latest
    container_name: rojgarai-qdrant-test
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant-test-data:/qdrant/storage

  redis-test:
    image: redis:7-alpine
    container_name: rojgarai-redis-test
    restart: always
    ports:
      - "6380:6379"

volumes:
  qdrant-test-data:
