services:
  postgres-test:
    image: postgres:16
    container_name: convexhire-postgres-test
    restart: always
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: convexhire_test
    ports:
      - "5433:5432"

  qdrant-test:
    image: qdrant/qdrant:latest
    container_name: convexhire-qdrant-test
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant-test-data:/qdrant/storage

  redis-test:
    image: redis:7-alpine
    container_name: convexhire-redis-test
    restart: always
    ports:
      - "6380:6379"

volumes:
  qdrant-test-data:
