name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: rojgarai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Without Redis every integration test is skipped by conftest
      # (redis_test_client), so CI used to pass while running nothing.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/rojgarai_test
      SECRET_KEY: ci-secret-key-not-used-in-production
      ALGORITHM: HS256
      ENVIRONMENT: test
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      SEND_EMAILS: "false"
      REDIS_ENABLED: "true"
      TEST_REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: noreply@example.com
      SMTP_PASSWORD: unused
      MAIL_FROM: noreply@example.com
      GOOGLE_CLIENT_ID: unused
      GOOGLE_CLIENT_SECRET: unused
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: rojgarai_test
      TEST_DB_USER: testuser
      TEST_DB_PASSWORD: testpassword
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: rojgarai_test
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID_SHORTLISTING: ${{ secrets.AWS_ACCESS_KEY_ID_SHORTLISTING }}
      AWS_SECRET_ACCESS_KEY_SHORTLISTING: ${{ secrets.AWS_SECRET_ACCESS_KEY_SHORTLISTING }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION_NAME: rojgarai
      REDIS_URL: ${{ secrets.REDIS_URL }}
      LANGSMITH_TRACING: "false"
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_API_KEY: unused
      LANGSMITH_PROJECT: Rojgar AI
      LLAMA_CLOUD_API_KEY: unused
      TAVILY_API_KEY: unused
      GOOGLE_API_KEY: unused

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Pinned: newer ruff releases add rules that fail the existing codebase.
      - name: Run Ruff linter
        run: uvx ruff@0.14.10 check

      - name: Check code formatting
        run: uvx ruff@0.14.10 format --check

      - name: Run tests
        run: |
          uv run pytest -v -rs | tee /tmp/pytest.txt
          # Guard against silently skipping everything (e.g. Redis/DB unreachable).
          tail -n 1 /tmp/pytest.txt | grep -q " passed" \
            || { echo "No tests passed — test infrastructure is not reachable." >&2; exit 1; }

  backend-docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Builds the production image; the Dockerfile fails the build if the
      # ML pre-filter model is missing.
      - name: Build image
        run: docker build -t rojgar-ai-backend:ci backend

      - name: Smoke-test runtime tools
        run: |
          docker run --rm --entrypoint sh rojgar-ai-backend:ci -c \
            "test -s /app/ml_bouncer_model.pkl"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Types & Lint
        run: |
          npm run type-check
          npm run lint
          npm run format:check

      - name: Build Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
