name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"

  pull_request:
    branches:
      - main
      - dev
      - "feat/**"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: convexhire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/convexhire_test
      SECRET_KEY: ci-secret-key-not-used-in-production
      ALGORITHM: HS256
      ENVIRONMENT: test
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      SEND_EMAILS: "false"
      REDIS_ENABLED: "false"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: noreply@example.com
      SMTP_PASSWORD: unused
      MAIL_FROM: noreply@example.com
      GOOGLE_CLIENT_ID: unused
      GOOGLE_CLIENT_SECRET: unused
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: convexhire_test
      TEST_DB_USER: testuser
      TEST_DB_PASSWORD: testpassword
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: convexhire_test
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID_SHORTLISTING: ${{ secrets.AWS_ACCESS_KEY_ID_SHORTLISTING }}
      AWS_SECRET_ACCESS_KEY_SHORTLISTING: ${{ secrets.AWS_SECRET_ACCESS_KEY_SHORTLISTING }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION_NAME: convexhire
      REDIS_URL: ${{ secrets.REDIS_URL }}
      LANGSMITH_TRACING: "false"
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_API_KEY: unused
      LANGSMITH_PROJECT: ConvexHire
      LLAMA_CLOUD_API_KEY: unused
      TAVILY_API_KEY: unused
      GOOGLE_API_KEY: unused

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uvx ruff check

      - name: Check code formatting
        run: uvx ruff format --check

      - name: Run tests
        run: uv run pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Types & Lint
        run: |
          pnpm type-check
          pnpm stylelint
          pnpm lint
          pnpm format:check

      - name: Build Application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
