# GitHub Actions CI Pipeline

# This workflow runs on every push and pull request to main/develop branches.
# It checks:
#   - Backend: Python linting and formatting with Ruff
#   - Frontend: ESLint checks and Prettier formatting

name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Checkout the code from your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up uv (modern Python package manager)
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: uv sync

      # Step 4: Run Ruff linter to check for code issues
      - name: Run Ruff linter
        run: uvx ruff check

      # Step 5: Check code formatting (fails if code isn't formatted)
      - name: Check code formatting
        run: uvx ruff format --check

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Bun
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Step 3: Install dependencies with Bun
      - name: Install dependencies
        run: bun install

      # Step 4: Run ESLint
      - name: Run ESLint
        run: bun run lint

      # Step 5: Prettier check (fails if formatting is off)
      - name: Prettier check
        run: bun run format:check
